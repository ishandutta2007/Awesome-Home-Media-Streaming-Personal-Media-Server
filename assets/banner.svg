<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent linear gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)" />
    </linearGradient>

    <!-- Animated glowing orbs / particles (background only) -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .bg-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .bg-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-wave {
        animation: waveFlow 12s linear infinite;
      }
      .orbit-dot {
        animation: floatOrb 6s ease-in-out infinite alternate;
      }
      @keyframes pulse1 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
        100% { transform: scale(1.3) translate(60px, 40px); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.2) translate(0px, 0px); opacity: 0.25; }
        100% { transform: scale(0.9) translate(-50px, -30px); opacity: 0.55; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #93c5fd;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Orbs (Safely placed behind foreground) -->
  <g filter="url(#blurFilter)">
    <circle class="bg-pulse-1" cx="240" cy="120" r="180" fill="url(#glowBlue)" />
    <circle class="bg-pulse-2" cx="960" cy="300" r="220" fill="url(#glowPurple)" />
  </g>

  <!-- Technical Grid Pattern Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" />
  </g>

  <!-- Ambient Dynamic Audio/Video Signal Wave (Subtle background flow) -->
  <g opacity="0.22" fill="none" stroke="url(#textGrad)" stroke-width="2.5">
    <path class="stream-wave" stroke-dasharray="16, 12" d="M -50,330 C 250,260 450,380 750,310 C 950,260 1100,340 1250,300" />
    <path class="stream-wave" stroke-dasharray="12, 10" d="M -50,350 C 280,390 520,280 820,350 C 1020,390 1150,320 1250,340" style="animation-direction: reverse; animation-duration: 15s;" />
  </g>

  <!-- Dynamic Status Indicator Pill (Top Center) -->
  <g transform="translate(485, 36)">
    <rect width="230" height="34" rx="17" fill="url(#pillGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
    <circle class="orbit-dot" cx="22" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" class="badge-text" fill="#e2e8f0">CURATED MEDIA ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Branding (Kept strictly on top, crystal clear) -->
  <g id="brand-header">
    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5px">
      Awesome Home Media Streaming
    </text>

    <!-- Subtitle -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#f8fafc" letter-spacing="0.2px">
      Personal Media Servers, Self-Hosted Streaming &amp; Open-Source Entertainment
    </text>

    <text x="600" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      High-performance video servers, audiophile music hubs, audiobook streamers &amp; media automation stacks
    </text>
  </g>

  <!-- Foreground Interactive-style Feature Badges -->
  <g transform="translate(185, 290)">
    <!-- Video Servers -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#38bdf8">🎬 Video Servers</text>
      <text x="90" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#64748b">Jellyfin • Plex • Emby</text>
    </g>

    <!-- Audio Streaming -->
    <g transform="translate(210, 0)">
      <rect width="180" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#a855f7">🎵 Music &amp; Audio</text>
      <text x="90" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#64748b">Navidrome • Koel • Roon</text>
    </g>

    <!-- Books & Podcasts -->
    <g transform="translate(420, 0)">
      <rect width="180" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#f43f5e">📚 Books &amp; Pods</text>
      <text x="90" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#64748b">Audiobookshelf • Kavita</text>
    </g>

    <!-- Photos & Companion -->
    <g transform="translate(630, 0)">
      <rect width="200" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="100" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#10b981">⚡ Automation &amp; Photos</text>
      <text x="100" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#64748b">Immich • *arr Stacks</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#textGrad)" />
</svg>
